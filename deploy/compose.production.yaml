name: guangmo-growth
x-logging: &logging
  driver: local
  options:
    max-size: '10m'
    max-file: '3'
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://guangmo:${POSTGRES_PASSWORD:?required}@postgres:5432/guangmo
  REDIS_URL: redis://redis:6379
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: guangmo
      POSTGRES_DB: guangmo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - /srv/guangmo/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U guangmo -d guangmo']
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 768m
    shm_size: 128m
    logging: *logging
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy noeviction
    restart: unless-stopped
    volumes:
      - /srv/guangmo/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 320m
    logging: *logging
  migrate:
    image: ${IMAGE_PREFIX:?required}/api:${RELEASE:?required}
    environment: *app-env
    command: ['node', 'node_modules/@guangmo/database/dist/migrate.js']
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    logging: *logging
  api:
    image: ${IMAGE_PREFIX:?required}/api:${RELEASE:?required}
    restart: unless-stopped
    init: true
    environment:
      <<: *app-env
      API_HOST: 0.0.0.0
      API_PORT: '3001'
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?required}
      BETTER_AUTH_URL: https://${SITE_HOST:?required}
      WEB_ORIGIN: https://${SITE_HOST:?required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      RESEARCH_MODEL: ${RESEARCH_MODEL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    mem_limit: 512m
    logging: *logging
  worker:
    image: ${IMAGE_PREFIX:?required}/worker:${RELEASE:?required}
    restart: unless-stopped
    init: true
    environment:
      <<: *app-env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      RESEARCH_MODEL: ${RESEARCH_MODEL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 15m
    mem_limit: 1024m
    logging: *logging
  web:
    image: ${IMAGE_PREFIX:?required}/web:${RELEASE:?required}
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:?required}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /srv/guangmo/caddy:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    logging: *logging
volumes:
  caddy_config:
